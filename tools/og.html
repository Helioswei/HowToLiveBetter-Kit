<!DOCTYPE html>
<!-- 生成社交分享图（1200×630）。本地跑：
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
       --hide-scrollbars --window-size=1200,630 --screenshot=deploy/assets/og.png tools/og.html
     CI 里不需要 Chrome —— 生成好的 PNG 直接入库（deploy/assets/og.png）。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><style>
  :root { --paper:#faf8f4; --paper-soft:#f6f3ec; --hairline:#e2dccf;
          --ink:#26292f; --ink-secondary:#5b6069; --muted:#8b8f97;
          --accent:#b3402f; --accent-strong:#8f2f22; --accent-soft:#f4e5e0;
          --serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong",SimSun,Georgia,serif;
          --sans:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:var(--paper); color:var(--ink);
         font-family:var(--sans); display:flex; align-items:center; padding:0 80px; gap:56px;
         position:relative; overflow:hidden; }
  .left { flex:1 1 auto; min-width:0; }
  h1 { font-family:var(--serif); font-size:66px; line-height:1.18; letter-spacing:.01em; }
  .sub { margin-top:22px; font-size:25px; color:var(--ink-secondary); line-height:1.6; }
  .url { position:absolute; left:80px; bottom:52px; font-size:23px; color:var(--accent); letter-spacing:.02em; }
  .right { flex:0 0 430px; height:430px; }
  .right svg { width:430px; height:430px; }
  svg { display:block; }
</style></head><body>
  <div class="left">
    <h1>高性价比人生指南</h1>
    <p class="sub">按性价比排序的 676 条循证建议<br>每条写明花掉什么、换回什么、证据有多硬</p>
      </div>
  <div class="right">
    <!-- 小图：把 676 条按"投入 → 收益"点在一张图上（正式页在 /map.html） -->
    __POINTS__
  </div>
  <p class="url">better.aigcwei.cn</p>
</body></html>
